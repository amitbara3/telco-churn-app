name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      - name: Run test suite
        run: python -m pytest tests/ -q

  training:
    name: Training script runs end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - run: pip install -r requirements-dev.txt

      # The test suite exercises the saved artifact, not the code that
      # produces it — so a broken train/train.py would pass CI and only
      # surface whenever someone next retrained. This runs it for real at a
      # reduced search budget: enough to catch import errors, API drift and
      # crashes, without spending the full ~2.5 minutes.
      - name: Train (reduced budget)
        env:
          CHURN_SEARCH_ITER: "2"
          CHURN_CV_FOLDS: "2"
        run: python train/train.py

      - name: Training produced every artifact the app needs
        run: |
          for f in churn_model.joblib decision_threshold.json metrics.json \
                   feature_importance.json feature_schema.json; do
            test -s "model/$f" || { echo "::error::model/$f missing or empty"; exit 1; }
            echo "ok: model/$f"
          done

      # The freshly trained model is a reduced-budget one, so the shipped
      # artifacts must not be left modified for any later job to pick up.
      - name: Restore committed artifacts
        run: git checkout -- model/

  docker:
    name: Docker image builds and serves
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The whole deployment target is a Docker image, so a Dockerfile that
      # only builds "in theory" is the single biggest deploy risk. This job
      # builds it and proves the running container actually answers before
      # anything reaches Hugging Face Spaces.
      - name: Build image
        run: docker build -t telco-churn-app .

      - name: Report image size
        run: |
          size=$(docker image inspect telco-churn-app --format '{{.Size}}')
          mb=$((size / 1000000))
          echo "Image size: ${mb} MB"
          echo "### Docker image: ${mb} MB" >> "$GITHUB_STEP_SUMMARY"
          # Hugging Face Spaces allows well above this; the check is here to
          # make an accidental jump (a stray heavy dependency) visible.
          if [ "$mb" -gt 2000 ]; then
            echo "::warning::Image is ${mb} MB — larger than expected for this app."
          fi

      - name: Start container
        run: |
          docker run -d --name churn -p 7860:7860 -p 8000:8000 telco-churn-app
          echo "Waiting for the API to become healthy..."
          for _ in $(seq 1 90); do
            if curl -sf http://localhost:8000/health > /dev/null; then
              echo "API is up."
              exit 0
            fi
            if ! docker ps --filter name=churn --filter status=running -q | grep -q .; then
              echo "::error::Container exited during startup."
              docker logs churn
              exit 1
            fi
            sleep 2
          done
          echo "::error::API never became healthy."
          docker logs churn
          exit 1

      - name: Prediction endpoint returns a usable result
        run: |
          response=$(curl -sf -X POST http://localhost:8000/predict \
            -H 'Content-Type: application/json' \
            -d '{"gender":"Female","SeniorCitizen":0,"Partner":"Yes","Dependents":"No",
                 "tenure":1,"PhoneService":"No","MultipleLines":"No phone service",
                 "InternetService":"DSL","OnlineSecurity":"No","OnlineBackup":"Yes",
                 "DeviceProtection":"No","TechSupport":"No","StreamingTV":"No",
                 "StreamingMovies":"No","Contract":"Month-to-month","PaperlessBilling":"Yes",
                 "PaymentMethod":"Electronic check","MonthlyCharges":29.85,"TotalCharges":29.85}')
          echo "$response"
          echo "$response" | grep -q churn_probability

      # Streamlit starts only after start.sh confirms the API is healthy,
      # and then takes a few seconds to bind — so this has to poll rather
      # than check once, the way the API step does.
      - name: Streamlit UI is served
        run: |
          for _ in $(seq 1 45); do
            if curl -sf -o /dev/null http://localhost:7860; then
              echo "Streamlit UI is serving."
              exit 0
            fi
            if ! docker ps --filter name=churn --filter status=running -q | grep -q .; then
              echo "::error::Container exited while waiting for the UI."
              docker logs churn
              exit 1
            fi
            sleep 2
          done
          echo "::error::Streamlit UI never became reachable."
          docker logs churn
          exit 1

      - name: Container logs
        if: always()
        run: docker logs churn
